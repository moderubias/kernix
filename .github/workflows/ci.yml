name: Rust CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Test on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo run -p kernix --example train_patterns --locked
      - run: cargo run -p kernix --example temporal_state --locked
      - run: cargo run -p kernix --example sparse --locked
      - run: python tools/check_doc_examples.py
      - run: python tools/check_ergonomics.py
      - run: python tools/check_operation_support.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m unittest discover -s benchmarks -p 'test_*.py'
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check -p kernix --no-default-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - run: cargo check --workspace --locked
      - run: python tools/check_ergonomics.py --toolchain 1.86.0
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, i686-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p kernix --no-default-features --target ${{ matrix.target }} --locked
      - run: python tools/check_ergonomics.py --target ${{ matrix.target }}

  evidence-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/requirements.txt
      - run: python -m unittest discover -s benchmarks -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path benchmarks/harness/Cargo.toml -- --check
      - run: cargo test --manifest-path benchmarks/harness/Cargo.toml --locked
      - run: cargo test --manifest-path benchmarks/harness/Cargo.toml --locked --features allocation-counting -- --test-threads=1
      - run: cargo clippy --manifest-path benchmarks/harness/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path benchmarks/harness/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo run --manifest-path benchmarks/harness/Cargo.toml --locked -- matmul_sum_backward_32x16x8_f64 candle first
      - run: cargo run --manifest-path benchmarks/harness/Cargo.toml --locked -- qr_96x32_f64 faer first
