name: Bounded numerical fuzzing
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 0'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [layout, factorizations]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: Seed evolving corpus
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cp fuzz/seeds/${{ matrix.target }}/* fuzz/corpus/${{ matrix.target }}/
      - run: cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=180 -max_len=512 -timeout=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-repro-${{ matrix.target }}
          path: fuzz/artifacts/
