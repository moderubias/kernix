name: Hardware performance evidence
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to measure
        type: choice
        default: all
        options: [all, ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
  schedule:
    - cron: '11 3 1 * *'
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.runner == 'all' || inputs.runner == '') && '["ubuntu-latest","ubuntu-24.04-arm","windows-latest","macos-latest"]' || format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/requirements.txt
      - name: Measure clean source and record actual hardware
        run: python benchmarks/evidence.py runner-${{ matrix.os }}-${{ github.run_id }}
        env:
          RUSTC_WRAPPER: ''
          CARGO_BUILD_JOBS: '2'
      - name: Measure exact registry baseline on the same host
        run: python benchmarks/evidence.py baseline-${{ matrix.os }}-${{ github.run_id }} --registry-baseline 0.11.0
        env:
          RUSTC_WRAPPER: ''
          CARGO_BUILD_JOBS: '2'
      - name: Interleave frozen current and baseline processes
        run: >-
          python benchmarks/compare.py
          web/benchmarks/runner-${{ matrix.os }}-${{ github.run_id }}
          web/benchmarks/baseline-${{ matrix.os }}-${{ github.run_id }}
          web/benchmarks/paired-${{ matrix.os }}-${{ github.run_id }}
          --rounds 9 --workloads matmul_32_f64 matmul_128_f64 matmul_128_f32 matmul_256_f64 matmul_256_f32
          matmul_sum_backward_32x16x8_f64 matmul_ab_128_f64 matmul_ab_128_f32 matmul_batched_4x16x32x16_f64 matmul_batched_4x16x32x16_f32 cholesky_factor_128_f64 cholesky_factor_256_f64 cholesky_factor_512_f64
          parallel_matmul_into_128_f64 parallel_matmul_into_256_f64 parallel_matmul_into_128_f32
      - name: Present paired evidence alongside peer observations
        run: >-
          python benchmarks/report.py web/benchmarks/runner-${{ matrix.os }}-${{ github.run_id }}
          --baseline web/benchmarks/baseline-${{ matrix.os }}-${{ github.run_id }}
          --paired web/benchmarks/paired-${{ matrix.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.os }}
          path: web/benchmarks/
