name: Miri memory-safety check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Install Miri sysroot
        run: cargo +nightly miri setup
      - name: Exercise unsafe storage and tensor code
        run: cargo +nightly miri test -p kernix-core --tests
        env:
          # Proptest's disk persistence calls getcwd in Miri isolation. Keep
          # isolation and every property case; only disable saving seed files.
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: '1'
          MIRIFLAGS: -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE
      - name: Exercise checked native matrix wrappers
        # SIMD kernels are disabled by cfg(miri). Check addressing, bounds and
        # output contracts here; full large cases execute in hardware/ASan CI.
        run: python tools/check_miri.py
