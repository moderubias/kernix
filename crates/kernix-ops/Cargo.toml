[package]
name = "kernix-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linear algebra and tensor operations for Kernix."
repository.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "LICENSES/**", "KIYOSHIMA.json"]

[features]
default = ["std"]
portable-math = []

std = [
    "kernix-core/std",
    "thiserror/std",
    "matrixmultiply/std",
    "dep:gemm-f64",
    "dep:gemm-common",
]

parallel = [
    "std",
    "dep:rayon",
]

serde = [
    "kernix-core/serde",
]

[dependencies]
thiserror.workspace = true
matrixmultiply = { version = "0.3.11", default-features = false }
kernix-core.workspace = true

rayon = { workspace = true, optional = true }
libm = { version = "0.2", default-features = false }

[dev-dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
ndarray = "0.17.2"
serde_json.workspace = true
proptest.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
gemm-f64 = { version = "0.19.0", default-features = false, features = ["std"], optional = true }
gemm-common = { version = "0.19.0", default-features = false, features = ["std"], optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
