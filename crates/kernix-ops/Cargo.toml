[package]
name = "kernix-ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linear algebra and tensor operations for Kernix."
repository.workspace = true
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "LICENSES/**", "KIYOSHIMA.json"]

[features]
default = ["std"]

std = [
    "kernix-core/std",
]

parallel = [
    "std",
    "dep:rayon",
]

serde = [
    "kernix-core/serde",
]

[dependencies]
kernix-core.workspace = true

rayon = { workspace = true, optional = true }
libm = { version = "0.2", default-features = false }

[dev-dependencies]
ndarray = "0.17.2"
serde_json.workspace = true
proptest.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
