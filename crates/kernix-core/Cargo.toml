[package]
name = "kernix-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core data structures and invariants for Kernix."

repository.workspace = true
readme = "README.md"

keywords = ["tensor", "shape", "linear-algebra"]
categories = ["mathematics", "science"]

include = [
    "src/**",
    "tests/**",
    "README.md",
    "LICENSE",
    "LICENSES/**",
    "KIYOSHIMA.json",
]

[features]
default = ["std"]

std = [
    "thiserror/std",
    "serde?/std",
]

serde = [
    "dep:serde",
    "serde/alloc",
    "smallvec/serde",
]

[dependencies]
thiserror.workspace = true
smallvec.workspace = true

serde = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
