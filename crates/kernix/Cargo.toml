[package]
name = "kernix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "Safe N-dimensional tensor primitives and extensible computation foundations for Rust."
readme = "README.md"

keywords = ["tensor", "shape", "linear-algebra"]
categories = ["mathematics", "science"]

include = [
    "src/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE",
    "LICENSES/**",
    "KIYOSHIMA.json",
]

[features]
default = ["std", "config"]
portable-math = ["kernix-ops/portable-math"]
std = ["kernix-core/std", "kernix-ops/std", "thiserror/std"]
serde = ["kernix-core/serde", "kernix-ops/serde"]
parallel = ["std", "kernix-ops/parallel"]

config = ["std", "dep:serde", "dep:toml"]

[dependencies]
thiserror.workspace = true
serde = { workspace = true, optional = true }
toml = { version = "0.8", optional = true }
kernix-core.workspace = true
kernix-ops.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "train_patterns"
required-features = ["std"]

[dev-dependencies]
ndarray = "0.17.2"
serde_json.workspace = true
